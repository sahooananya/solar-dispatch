version: "3.9"
services:
  postgres:
    image: postgres:15-alpine
    container_name: solardispatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: solardispatch
    ports:
      - "5432:5432"
    volumes:
      - solardispatch_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d solardispatch"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  solardispatch_pg:
